
services:
  postgresql-dev:
    image: postgres:16-alpine
    container_name: postgresql-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: db-dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql-test-e2e:
    image: postgres:16-alpine
    container_name: postgresql-test-e2e
    restart: unless-stopped
    environment:
      POSTGRES_DB: db-test-e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "25432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-test-e2e"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: production
    container_name: nestjs-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_NAME: db-dev
      DATABASE_HOST: postgresql-dev
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret}
      JWT_EXPIRES_IN: 3600
      JWT_REFRESH_EXPIRES_IN: 360000
    depends_on:
      postgresql-dev:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_dev_data:
  postgres_test_data:

networks:
  app-network:
    driver: bridge
